name: Sign Container Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/manpreet881449-arch/sample-app
      DIGEST: sha256:2946df84c6516b588d1a5c256d6b319232a5f4af6134b8044a33f1c77ea20a06
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Sign image
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Install grype and OPA
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa && sudo mv opa /usr/local/bin/

      - name: Deploy gate
        env:
          COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/sign-image.yml@refs/heads/main
          COSIGN_ISSUER: https://token.actions.githubusercontent.com
        run: ./scripts/gate.sh "$IMAGE@$DIGEST"
